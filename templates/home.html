<!DOCTYPE html>
<html>
<head>
    <title>ACEest Fitness and Gym</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: Arial; }
        .header { background: #d4af37; color: #000; padding: 20px; font-size: 24px; font-weight: bold; }
        .container { margin: 40px auto; width: 600px; background: #222; padding: 30px; border-radius: 10px; }
        .select { margin-bottom: 20px; }
        .workout { color: {{ color }}; margin-bottom: 20px; }
        .diet { margin-bottom: 20px; }
        .metrics { background: #333; color: #ddd; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">ACEest FUNCTIONAL FITNESS</div>
    <div class="container">
        <form method="post">
            <div class="select">
                <label for="profile">Select Program:</label>
                <select name="profile" id="profile">
                    {% for key in programs.keys() %}
                        <option value="{{ key }}" {% if key == selected %}selected{% endif %}>{{ key }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="select">
                <label for="name">Name:</label>
                <input type="text" name="name" id="name" value="{{ name }}">
            </div>
            <div class="select">
                <label for="age">Age:</label>
                <input type="number" name="age" id="age" value="{{ age }}">
            </div>
            <div class="select">
                <label for="weight">Weight (kg):</label>
                <input type="number" step="0.1" name="weight" id="weight" value="{{ weight }}">
            </div>
            <div class="select">
                <label for="adherence">Weekly Adherence (%):</label>
                <input type="number" name="adherence" id="adherence" min="0" max="100" value="{{ adherence }}">
            </div>
            <button type="submit">Submit</button>
        </form>
        <div class="metrics">
            CAPACITY: 150 Users<br>
            AREA: 10,000 sq ft<br>
            BREAK-EVEN: 250 Members<br>
            {% if calories %}
                <strong>Estimated Calories:</strong> {{ calories }} kcal<br>
            {% endif %}
        </div>
        <div class="workout">
            <strong>Weekly Workout Chart:</strong><br>
            {{ workout|safe }}
        </div>
        <div class="diet">
            <strong>Daily Nutrition Plan (Tamil Nadu Context):</strong><br>
            {{ diet|safe }}
        </div>
    </div>
</body>
</html>
